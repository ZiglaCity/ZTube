[tool.pytest.ini_options]
addopts = [
    "-p",
    "no:cacheprovider",
]
testpaths = ["desktop/tests"]

[tool.ruff]
line-length = 88
target-version = "py313"
exclude = [
    ".git",
    ".venv",
    ".tmp",
    "pytest-cache-files-*",
    "build",
    "dist",
]

[tool.ruff.lint]
select = ["E", "F", "I"]
